name: Bootstrap Janelle Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Copy stable dashboard source
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -L --fail --retry 3 \
            https://github.com/Dahlmansverksted/Dashboard/archive/refs/heads/main.zip \
            -o "$tmp/source.zip"
          unzip -q "$tmp/source.zip" -d "$tmp"
          source_dir="$tmp/Dashboard-main"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$source_dir"/. .

      - name: Apply Janelle identity and pink theme
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('<title>Dahlman Dashboard</title>', '<title>Janelle Dashboard</title>')
          text = text.replace('Welcome Mr. and Mrs. Dahlman', 'Welcome Janelle')
          text = text.replace('<strong>Dahlman</strong><small>Dashboard</small>', '<strong>Janelle</strong><small>Dashboard</small>')
          if 'janelle-theme.css' not in text:
              text = text.replace('</head>', '<link rel="stylesheet" href="janelle-theme.css?v=1"></head>')
          index.write_text(text, encoding='utf-8')

          # Give this installation its own browser storage namespace.
          v3 = root / 'dashboard-v3.js'
          if v3.exists():
              s = v3.read_text(encoding='utf-8')
              s = s.replace("const KEY='dahlman_dashboard_v3';", "const KEY='janelle_dashboard_v1';")
              v3.write_text(s, encoding='utf-8')

          unified = root / 'dashboard-unified.js'
          if unified.exists():
              s = unified.read_text(encoding='utf-8')
              s = s.replace("PAGE_TITLE='Welcome Mr. and Mrs. Dahlman'", "PAGE_TITLE='Welcome Janelle'")
              s = s.replace("<strong>Dashboard</strong>", "<strong>Janelle Dashboard</strong>")
              unified.write_text(s, encoding='utf-8')

          daily = root / 'daily-routine.js'
          if daily.exists():
              s = daily.read_text(encoding='utf-8')
              s = s.replace("dahlman_daily_routine_oslo_v2", "janelle_daily_routine_manila_v1")
              # Janelle's own dashboard follows Philippine local midnight.
              s = s.replace("Europe/Oslo", "Asia/Manila")
              s = s.replace("Norway time", "Philippines time")
              daily.write_text(s, encoding='utf-8')

          manifest = root / 'manifest.json'
          if manifest.exists():
              try:
                  obj = json.loads(manifest.read_text(encoding='utf-8'))
                  obj['name'] = 'Janelle Dashboard'
                  obj['short_name'] = 'Janelle'
                  obj['theme_color'] = '#ff4fa3'
                  obj['background_color'] = '#080508'
                  manifest.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              except Exception:
                  pass

          theme = r'''/* Janelle Dashboard — black and pink theme */
          :root{
            --bg:#080508!important;
            --panel:#130d13!important;
            --card:#171017!important;
            --text:#fff7fb!important;
            --muted:#c7aebb!important;
            --line:rgba(255,105,180,.18)!important;
            --oak:#ff78ba!important;
            --walnut:#ff3f9b!important;
            --accent:#ff4fa3!important;
          }
          body{
            background:
              radial-gradient(circle at 78% 3%,rgba(255,79,163,.20),transparent 34%),
              radial-gradient(circle at 12% 88%,rgba(130,25,85,.20),transparent 42%),
              #080508!important;
          }
          #backgroundSlideshow{
            background:radial-gradient(circle at 70% 0%,rgba(255,79,163,.20),transparent 42%),#080508!important;
          }
          .bg-slide{filter:saturate(.72) brightness(.48) contrast(1.06)!important}
          .bg-overlay{
            background:linear-gradient(90deg,rgba(8,5,8,.82),rgba(18,8,15,.62) 48%,rgba(20,7,16,.55),rgba(8,5,8,.78))!important;
          }
          aside,.card,.world-widget,.hero,.v8-carousel,.goal-card,.workout,.date-card,.shopping-card,.note-card,
          .budget-excel-panel,.stat-tile{
            border-color:rgba(255,105,180,.17)!important;
            box-shadow:0 18px 55px rgba(0,0,0,.28)!important;
          }
          aside{background:rgba(9,5,9,.90)!important}
          .card,.world-widget,.goal-card,.workout,.date-card,.shopping-card,.note-card,.budget-excel-panel{
            background:linear-gradient(145deg,rgba(28,16,26,.94),rgba(14,9,14,.94))!important;
          }
          button.primary,.primary,.daily-routine-item.done .daily-routine-box{
            background:linear-gradient(135deg,#ff3f9b,#ff78ba)!important;
            border-color:#ff78ba!important;
            color:#170711!important;
          }
          button.outline,.outline,.nav.active,.filter.active{
            border-color:rgba(255,105,180,.45)!important;
            background:rgba(255,79,163,.12)!important;
          }
          .nav.active,.link,.goal-percent,.weather-line b,.clock{color:#ff8dc6!important}
          .progress i,.goal-progress i,.habit-bar i{
            background:linear-gradient(90deg,#ff3f9b,#ff9dce)!important;
          }
          input:focus,select:focus,textarea:focus{border-color:#ff68b2!important;box-shadow:0 0 0 3px rgba(255,79,163,.13)!important}
          ::selection{background:rgba(255,79,163,.38)}
          @media(max-width:700px){.bg-overlay{background:rgba(8,5,8,.66)!important}}
          '''
          (root / 'janelle-theme.css').write_text(theme, encoding='utf-8')

          readme = root / 'README.md'
          readme.write_text('''# Janelle Dashboard\n\nA separate personal dashboard for Janelle, based on the Dahlman Dashboard codebase.\n\n- Independent Cloudflare Pages project\n- Independent D1 database\n- Black and pink visual theme\n- Separate browser storage namespace\n''', encoding='utf-8')
          PY

      - name: Remove bootstrap workflow and commit result
        run: |
          rm -f .github/workflows/bootstrap-janelle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create Janelle Dashboard with black and pink theme"
          git push
